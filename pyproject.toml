[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-reviewer"
version = "0.1.0"
description = "Provider-neutral local code review runner for Codex and Claude Code"
requires-python = ">=3.10"

[project.scripts]
local-reviewer = "local_reviewer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
